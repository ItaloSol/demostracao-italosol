<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demonstrações de sites</title>
<meta name="description" content="Sites de demonstração por segmento de negócio.">
<style>
:root{--ink:#14213a;--muted:#55627a;--line:#dfe5ee;--bg:#f6f8fb;--accent:#0f56b3;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{width:min(100% - 36px,960px);margin-inline:auto}
header{padding:56px 0 28px}
.eyebrow{font-size:.8rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:10px 0 12px;font-size:clamp(1.9rem,6vw,2.9rem);line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
header p{margin:0;color:var(--muted);max-width:52ch}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));padding:8px 0 64px}
.card{display:flex;flex-direction:column;gap:8px;min-height:190px;padding:22px;background:var(--white);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 12px 28px -18px rgba(20,33,58,.45)}
.card:focus-visible{outline:3px solid #f5a524;outline-offset:3px}
.path{font:600 .82rem ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}
.card h2{margin:0;font-size:1.3rem;line-height:1.2}
.card p{margin:0;color:var(--muted);font-size:.97rem}
.go{margin-top:auto;padding-top:10px;font-weight:700;color:var(--accent)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
</style>
</head>
<body>
<header class="wrap">
  <div class="eyebrow">italosol</div>
  <h1>Demonstrações de sites</h1>
  <p>Exemplos de como o seu negócio pode se apresentar na internet. Escolha o segmento para abrir a demonstração.</p>
</header>
<main class="wrap">
  <div class="grid">
<!--DEMOS-->
  </div>
</main>
</body>
</html>
