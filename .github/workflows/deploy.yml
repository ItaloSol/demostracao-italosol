# Publica todas as demonstrações no Firebase Hosting a cada push.
name: Publicar no Firebase Hosting

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Montar a pasta public
        run: node scripts/build.mjs
      - name: Publicar
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FIR_ITALO_4A8BE }}
          projectId: fir-italo-4a8be
          channelId: live
